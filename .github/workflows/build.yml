name: Build AirTranslate macOS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Package App Bundle
        run: |
          set -euo pipefail
          source script/app_metadata.sh
          DIST_DIR="$PWD/dist"
          APP_BUNDLE="$DIST_DIR/$APP_NAME.app"
          APP_CONTENTS="$APP_BUNDLE/Contents"
          APP_MACOS="$APP_CONTENTS/MacOS"
          APP_RESOURCES="$APP_CONTENTS/Resources"
          APP_BINARY="$APP_MACOS/$APP_NAME"
          INFO_PLIST="$APP_CONTENTS/Info.plist"
          ENTITLEMENTS_PATH="$PWD/Resources/AirTranslate.entitlements"

          echo "Building binary with release configuration..."
          swift build -c release
          BUILD_BINARY="$(swift build -c release --show-bin-path)/$APP_NAME"

          echo "Assembling $APP_NAME.app..."
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_MACOS"
          mkdir -p "$APP_RESOURCES"
          cp "$BUILD_BINARY" "$APP_BINARY"
          chmod +x "$APP_BINARY"
          if [ -f "$PWD/Resources/AppIcon.icns" ]; then
            cp "$PWD/Resources/AppIcon.icns" "$APP_RESOURCES/AppIcon.icns"
          fi

          ./script/write_info_plist.sh "$INFO_PLIST" local

          echo "Codesigning app bundle..."
          /usr/bin/codesign --force --deep --options runtime --entitlements "$ENTITLEMENTS_PATH" --sign - "$APP_BUNDLE"

          echo "Compressing app bundle..."
          cd "$DIST_DIR"
          zip -r -y "$GITHUB_WORKSPACE/AirTranslate-Vietnamese.zip" "$APP_NAME.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirTranslate-Vietnamese
          path: AirTranslate-Vietnamese.zip
